  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexOrgyn Labs | Sovereign Institutional Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --quantum-blue: #00D1FF;
        --plasma-purple: #9D00FF;
        --spectral-orange: #FF8A00;
        --spectral-yellow: #FACC15;
        --spectral-green: #4ADE80;
        --space-navy: #010409;
        --void-black: #000000;
      }
      
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--void-black);
        color: #F8FAFC;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      
      .font-heading { font-family: 'Space Grotesk', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      .neural-grid {
        background-image: 
          linear-gradient(rgba(0, 209, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 209, 255, 0.04) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at center, black, transparent 90%);
      }

      .circuit-pattern {
        background-image: 
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 120px 120px;
        opacity: 0.3;
      }

      .glass {
        background: rgba(8, 10, 15, 0.7);
        backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .premium-glow-cyan {
        box-shadow: 0 0 60px -15px rgba(0, 209, 255, 0.25);
      }

      .sovereign-gradient-text {
        background: linear-gradient(to right, #FF8A00, #FACC15, #4ADE80, #22D3EE);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .sovereign-grey-text {
        background: linear-gradient(to bottom, #FFFFFF 0%, #94A3B8 50%, #475569 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .isometric-parent {
        perspective: 2500px;
        transform-style: preserve-3d;
      }

      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: #000000; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }
      ::-webkit-scrollbar-thumb:hover { background: var(--quantum-blue); }

      @keyframes float {
        0%, 100% { transform: translateY(0px) translateZ(-200px); opacity: 0.05; }
        50% { transform: translateY(-30px) translateZ(-180px); opacity: 0.15; }
      }
      
      .monolith-grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 8px;
        position: absolute;
        inset: 0;
        z-index: -1;
      }
      
      .monolith-item {
        background: linear-gradient(to bottom, #1e293b, transparent);
        height: 100vh;
        width: 100%;
        transform-style: preserve-3d;
      }

      .hero-3d-scene {
        perspective: 1200px;
        transform-style: preserve-3d;
      }

      .carbon-overlay {
        background-image: linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
        background-size: 8px 8px;
      }
    </style>
